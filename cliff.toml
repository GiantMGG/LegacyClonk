# git-cliff configuration — https://git-cliff.org/docs/configuration
# Renders a Keep-a-Changelog section per tag from conventional commits.

[changelog]
header = """
# Changelog

All notable changes to LegacyClonk are documented here. The format is based on
[Keep a Changelog](https://keepachangelog.com/en/1.1.0/), and this project adheres
to [Conventional Commits](https://www.conventionalcommits.org/en/v1.0.0/).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}\
            {% if commit.scope == "network" %}**Networking**: \
            {% elif commit.scope == "savegame" %}**Save Games**: \
            {% elif commit.scope == "rollback" %}**Rollback**: \
            {% elif commit.scope == "replay" %}**Replay**: \
            {% elif commit.scope == "weather" %}**Weather**: \
            {% elif commit.scope == "preservation" %}**Preservation**: \
            {% elif commit.scope == "input" %}**Input**: \
            {% elif commit.scope == "ccan" %}**CCAN**: \
            {% elif commit.scope == "tutorial" %}**Tutorials**: \
            {% elif commit.scope == "players" %}**Players**: \
            {% elif commit.scope == "contributors" %}**Contributors**: \
            {% else %}**{{ commit.scope }}**: \
            {% endif %}\
        {% endif %}\
        {{ commit.message | upper_first }} ({{ commit.id | truncate(length=7, end="") }})
    {% endfor %}
{% endfor %}
"""
trim = true
footer = ""

[git]
# Parse conventional commits; keep but de-emphasise non-conventional ones.
conventional_commits = true
filter_unconventional = false
split_commits = false

commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^content", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^(perf|refactor|style)", group = "Changed" },
    { message = "^remove", group = "Removed" },
    { message = "^(docs|test|ci|build|tools|chore)", group = "Internal" },
    { body = ".*security", group = "Security" },
    { message = ".*", group = "Other" },
]
filter_commits = false
tag_pattern = "^v[0-9]+"
