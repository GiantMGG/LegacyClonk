name: BSD

on:
  push:
    branches: '*'
    tags-ignore: '*'
  pull_request:
    branches: '*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  freebsd:
    name: FreeBSD 14.2 (console-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "FreeBSD VM: pkg install + build + test"
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          mem: 4096
          cpus: 2
          usesh: bash
          cache-after-prepare: true
          prepare: |
            set -euo pipefail
            # FreeBSD ports install headers/libs under /usr/local; CMake does
            # not search there by default, so we pass -DCMAKE_PREFIX_PATH=/usr/local.
            pkg update -f
            pkg install -y \
              cmake \
              ninja \
              git \
              pkgconf \
              openssl \
              curl \
              zlib \
              fmtlib \
              libiconv \
              miniupnpc \
              spdlog \
              catch2
          run: |
            set -euo pipefail
            cd "$GITHUB_WORKSPACE"
            # Configure console-only, no LTO, tests on.
            # If find_package(miniupnpc CONFIG REQUIRED) fails because the
            # FreeBSD port ships only pkg-config files, fall back to
            # -DUSE_MINIUPNPC=OFF (UPnP is non-critical for a build smoke).
            if cmake -B build -G Ninja \
                  -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                  -DUSE_CONSOLE=ON \
                  -DUSE_TESTS=ON \
                  -DUSE_LTO=OFF \
                  -DCMAKE_PREFIX_PATH=/usr/local \
                  -DCMAKE_CTEST_ARGUMENTS='--output-on-failure;--no-tests=error'; then
              :
            else
              echo "Initial configure failed; retrying with -DUSE_MINIUPNPC=OFF"
              cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DUSE_CONSOLE=ON \
                -DUSE_TESTS=ON \
                -DUSE_LTO=OFF \
                -DUSE_MINIUPNPC=OFF \
                -DCMAKE_PREFIX_PATH=/usr/local \
                -DCMAKE_CTEST_ARGUMENTS='--output-on-failure;--no-tests=error'
            fi
            cmake --build build
            ctest --test-dir build --output-on-failure --no-tests=error

  openbsd:
    name: OpenBSD 7.9 (console-only, best-effort)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "OpenBSD VM: pkg_add + build + test"
        uses: vmactions/openbsd-vm@86cdc08415d9d0865267e686561e276c52d62530 # v1.4.7
        with:
          mem: 4096
          cpus: 2
          usesh: bash
          cache-after-prepare: true
          prepare: |
            set -euo pipefail
            # OpenBSD's package manager is pkg_add; packages live under /usr/local.
            # The base-OS Clang has incomplete C++23 support — see docs/BSD_PORT.md.
            # Package names verified against the OpenBSD 7.9 amd64 package index:
            #   - no `zlib` package (base provides libz), no `pkgconf`,
            #     no standalone `openssl` (ambiguous in the 7.9 repo; base
            #     LibreSSL satisfies FindOpenSSL), `fmtlib` is `fmt`,
            #   - console-only builds still hard-require `jpeg` and `png`
            #     (FindJPEG/FindPNG are REQUIRED when USE_WIC is off).
            pkg_add -I -v \
              cmake \
              ninja \
              git \
              curl \
              jpeg \
              png \
              fmt \
              libiconv \
              miniupnpc \
              spdlog \
              catch2
          run: |
            set -euo pipefail
            cd "$GITHUB_WORKSPACE"
            # Same configure-and-retry fallback as the FreeBSD lane.
            if cmake -B build -G Ninja \
                  -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                  -DUSE_CONSOLE=ON \
                  -DUSE_TESTS=ON \
                  -DUSE_LTO=OFF \
                  -DCMAKE_PREFIX_PATH=/usr/local \
                  -DCMAKE_CTEST_ARGUMENTS='--output-on-failure;--no-tests=error'; then
              :
            else
              echo "Initial configure failed; retrying with -DUSE_MINIUPNPC=OFF"
              cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DUSE_CONSOLE=ON \
                -DUSE_TESTS=ON \
                -DUSE_LTO=OFF \
                -DUSE_MINIUPNPC=OFF \
                -DCMAKE_PREFIX_PATH=/usr/local \
                -DCMAKE_CTEST_ARGUMENTS='--output-on-failure;--no-tests=error'
            fi
            cmake --build build
            ctest --test-dir build --output-on-failure --no-tests=error
