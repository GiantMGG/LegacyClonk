name: GUI X11 Compile

on:
  push:
    branches: '*'
    tags-ignore: '*'
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/gui-compile.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'cmake/**'
      - 'CMakeLists.txt'
      - '.github/workflows/gui-compile.yml'
  workflow_dispatch: {}

defaults:
  run:
    shell: bash

jobs:
  gui-x11-compile:
    name: GUI X11 compile
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      DEPS_VERSION: '2026-07-25'
      GCC_VERSION: '16.1.0'
      GCC_ARCH: 'x86_64'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: "Configure Platform"
        run: autobuild/platforms/Linux.sh

      - name: "Configure Platform Architecture"
        run: autobuild/platforms/Linux-x64.sh

      - name: "Install CMake"
        uses: lukka/get-cmake@v4.4.2
        with:
          useCloudCache: false

      - name: "Linux: Setup"
        run: $CHROOT autobuild/platforms/setup_linux.sh

      - name: "Linux: Install Xxf86vm"
        run: sudo DEBIAN_FRONTEND=noninteractive apt-get install --no-install-recommends -y libxxf86vm-dev

      - name: "Dependencies"
        run: |
          set -euo pipefail
          source tools/deps-lock.sh
          PLATFORM="Linux-x64"
          EXPECTED_SHA="$(lock_get tarballs "$PLATFORM")"
          TARBALL="lc_deps-${PLATFORM}.tar.gz"
          curl -fL -o "$TARBALL" \
            "https://github.com/legacyclonk/deps/releases/download/$DEPS_VERSION/$TARBALL"
          ACTUAL_SHA="$(sha256sum "$TARBALL" | cut -d' ' -f1)"
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: deps tarball SHA-256 mismatch for $PLATFORM" >&2
            echo "  expected: $EXPECTED_SHA" >&2
            echo "  actual:   $ACTUAL_SHA" >&2
            exit 1
          fi
          mkdir deps
          tar -xzf "$TARBALL" -C deps
          ( cd deps && ./fix_paths.sh )

      - name: "Configure"
        run: |
          cmake -B build . -G Ninja \
            $CMAKE_CONFIGURE_ARGS \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DUSE_TESTS=Off \
            -DUSE_CONSOLE=Off \
            -DWITH_DEVELOPER_MODE=Off \
            -DUSE_X11=On

      - name: "Assert lane config (anti-vacuous gate)"
        run: |
          set -eu
          CONFIG_VALUES="$(cmake -B build -LA -N | grep -E '^(USE_X11|USE_CONSOLE|WITH_DEVELOPER_MODE|USE_TESTS):')"
          {
            echo '### Decisive CMake cache values'
            echo '```'
            printf '%s\n' "${CONFIG_VALUES}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          assert_cache() {
            local var="$1" want="$2"
            if ! printf '%s\n' "${CONFIG_VALUES}" | grep -iEq "^${var}:BOOL=${want}$"; then
              echo "::error::${var} expected ${want} but cache drifted - see step summary"
              exit 1
            fi
          }
          assert_cache USE_X11 ON
          assert_cache USE_CONSOLE OFF
          assert_cache WITH_DEVELOPER_MODE OFF
          assert_cache USE_TESTS OFF

      - name: "Build"
        run: cmake --build build --target clonk $CMAKE_BUILD_ARGS
