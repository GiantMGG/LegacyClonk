name: Reproducibility Check

on:
  push:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'  # weekly Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      record-baseline:
        description: 'Run record-baseline (verify-repro.sh --update-baseline) instead of the check'
        type: boolean
        default: false

defaults:
  run:
    shell: bash

jobs:
  repro-check:
    name: verify-repro.sh (Linux-x64)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GCC_VERSION: '16.1.0'
      GCC_ARCH: 'x86_64'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: "Linux: Setup (apt deps + pinned GCC)"
        run: autobuild/platforms/setup_linux.sh

      - name: "Configure Platform"
        run: autobuild/platforms/Linux.sh

      - name: "Install CMake"
        uses: lukka/get-cmake@v4.4.2

      - name: "Run reproducibility check"
        run: |
          rc=0
          tools/verify-repro.sh > repro.log 2>&1 || rc=$?
          cat repro.log
          echo "verify-repro.sh exit code: $rc"
          if [ "$rc" -eq 3 ]; then
            echo "::warning::RESULT: skipped — no [baseline.binaries] entry for Linux-x64 in deps.lock. Dispatch this workflow with record-baseline=true to record one, then commit the artifact."
            exit 0
          fi
          exit "$rc"

      - name: "Upload reference binary"
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: repro-clonk-Linux-x64
          path: .repro-work/build/clonk

      - name: "First-diff diagnostics (diffoscope)"
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f .repro-work/build/clonk ]; then
            echo "No built binary present — skipping diffoscope."
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq diffoscope
          LAST_OK="$(gh run list --workflow repro-check.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' || echo '')"
          if [ -z "$LAST_OK" ] || [ "$LAST_OK" = "null" ]; then
            echo "No previous successful run — skipping diffoscope."
            exit 0
          fi
          mkdir -p /tmp/expected
          if ! gh run download "$LAST_OK" --name repro-clonk-Linux-x64 --dir /tmp/expected 2>/dev/null; then
            echo "Reference artifact unavailable in run $LAST_OK — skipping diffoscope."
            exit 0
          fi
          echo "=== diffoscope: last green clonk (run $LAST_OK) vs this build ==="
          diffoscope /tmp/expected/clonk .repro-work/build/clonk | head -300 || true

  record-baseline:
    name: record-baseline (Linux-x64)
    if: github.event_name == 'workflow_dispatch' && inputs.record-baseline
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      GCC_VERSION: '16.1.0'
      GCC_ARCH: 'x86_64'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: "Linux: Setup (apt deps + pinned GCC)"
        run: autobuild/platforms/setup_linux.sh

      - name: "Configure Platform"
        run: autobuild/platforms/Linux.sh

      - name: "Install CMake"
        uses: lukka/get-cmake@v4.4.2

      - name: "Record baseline"
        run: tools/verify-repro.sh --update-baseline

      - name: "Show deps.lock diff"
        run: git diff --no-color deps.lock || true

      - name: "Upload modified deps.lock"
        uses: actions/upload-artifact@v7
        with:
          name: deps-lock-with-baseline-Linux-x64
          path: deps.lock
