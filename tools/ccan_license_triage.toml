# Bilingual keyword -> verdict mapping for CCAN license triage.
# Consumed by `import_ccan.py discover`.
#
# Verdicts:
#   "skip"      - explicit no-reupload / do-not-redistribute
#   "ambiguous" - conflicting signals (e.g. "please ask first")
#   "unknown"   - no rule matched; B6 tier "unknown -> quarantine" applies.
#                 Affirmative licensing ALWAYS requires human (curator)
#                 confirmation: discover emits license "unknown" and the
#                 curated manifest must set a concrete license per entry
#                 (load_manifest rejects license = "unknown").
#
# Keywords are matched case-insensitively as substrings against the
# concatenated description_de + description_us + comments fields.
# The FIRST matching rule (in file order) wins.

[[rule]]
verdict = "skip"
keyword = "no reupload"
language = "en"

[[rule]]
verdict = "skip"
keyword = "kein reupload"
language = "de"

[[rule]]
verdict = "skip"
keyword = "do not redistribute"
language = "en"

[[rule]]
verdict = "skip"
keyword = "nicht weiterverbreiten"
language = "de"

[[rule]]
verdict = "ambiguous"
keyword = "please ask"
language = "en"

[[rule]]
verdict = "ambiguous"
keyword = "bitte fragen"
language = "de"

[default]
verdict = "unknown"
