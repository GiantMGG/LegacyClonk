# Hand-written numeric values for global constants, keyed by name.
#
# The harvest script (`tools/harvest_callbacks.py`) renders these in the
# `Value` column of `docs/reference/constants.md`. Values are resolved by
# hand from the enum definitions in `src/C4Def.h` (and the
# `C4ScriptConstMap[]` mappings in `src/C4Script.cpp`).
#
# Only the `C4D_*` category / connection constants are populated for now —
# these are the ones the modder tutorial (`docs/tutorials/first-object.md`)
# links to. Add more as needed.

