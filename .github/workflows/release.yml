name: Release
on:
  push:
    tags:
      - '*'

defaults:
  run:
    shell: pwsh

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-ci-config:
    name: Generate CI Configuration
    uses: './.github/workflows/ci-config.yml'

  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    needs: [generate-ci-config]
    permissions:
      contents: write
    env:
      BUILDVERSION: ${{ needs.generate-ci-config.outputs.buildversion }}
      TAG: v${{ needs.generate-ci-config.outputs.buildversion }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Render commit digest (git-cliff)
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header --tag ${{ env.TAG }}
          output: digest.md

      - name: Assemble release notes + splice CHANGELOG.md
        shell: bash
        run: |
          python3 tools/build_release_notes.py \
            --buildversion "${{ env.BUILDVERSION }}" \
            --tag "${{ env.TAG }}" \
            --digest digest.md \
            --highlights-dir docs/changelog \
            --out release-notes.md \
            --changelog CHANGELOG.md \
            --docs-mirror docs/changelog.md

      - name: Commit CHANGELOG.md + docs mirror back to master
        shell: bash
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md docs/changelog.md
          git commit -m "chore(changelog): update for ${{ env.TAG }} [skip ci]"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  build-binaries:
    name: Build Binaries
    needs: [generate-ci-config]
    uses: './.github/workflows/build.yml'
    with:
      matrix: ${{ needs.generate-ci-config.outputs.matrix-release-build }}
      pack-engine-and-c4group: true

  build-content:
    name: Content
    runs-on: windows-latest
    needs: [generate-ci-config, build-binaries]
    env:
      C4GROUP: ../c4group.exe
      LC_GROUPS: ${{ needs.generate-ci-config.outputs.groups }}
      OBJVERSION: ${{ needs.generate-ci-config.outputs.objversion }}
      OBJVERSIONNODOTS: ${{ needs.generate-ci-config.outputs.objversionnodots }}
      VERSION: ${{ needs.generate-ci-config.outputs.buildversion }}

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            autobuild
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.repository_owner }}/content
          ref: v${{ env.OBJVERSION }}
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          path: content

      - uses: actions/download-artifact@v8
        with:
          name: c4group-Windows-x64

      - name: Create output directory
        run: New-Item -Path content/output -ItemType Directory

      - name: Pack groups & create updates
        run: |
          Set-Location content
          ../autobuild/MakeContentGroupsAndUpdateGroups.ps1 -OutDir output

      - name: Publish content
        uses: actions/upload-artifact@v7
        with:
          name: content
          path: content/output/*.c4[dgf]

      - name: Publish content updates
        uses: actions/upload-artifact@v7
        with:
          name: content-updates
          path: |
            content/output/*.c4[dgf].c4u
            !content/output/lc_${{ env.OBJVERSIONNODOTS }}.c4u

      - name: Publish combined update
        uses: actions/upload-artifact@v7
        with:
          name: lc_${{ env.OBJVERSIONNODOTS }}.c4u
          path: content/output/lc_${{ env.OBJVERSIONNODOTS }}.c4u

  build-system-graphics-updates:
    name: "Update Groups: System.c4g & Graphics.c4g"
    runs-on: windows-latest
    needs: [generate-ci-config, build-binaries]
    env:
      C4GROUP: ./c4group.exe
      LC_GROUPS: ${{ needs.generate-ci-config.outputs.groups }}
      OBJVERSION: ${{ needs.generate-ci-config.outputs.objversion }}
      VERSION: ${{ needs.generate-ci-config.outputs.buildversion }}

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            autobuild

      - uses: actions/download-artifact@v8
        with:
          name: System.c4g
      - uses: actions/download-artifact@v8
        with:
          name: Graphics.c4g
      - uses: actions/download-artifact@v8
        with:
          name: c4group-Windows-x64

      - name: Create output directory
        run: New-Item -Path output -ItemType Directory

      - name: Create System.c4g update group
        run: autobuild/MakeEngineGroupUpdateGroups.ps1 -GroupPath System.c4g -OutDir output
      - name: Create Graphics.c4g update group
        run: autobuild/MakeEngineGroupUpdateGroups.ps1 -GroupPath Graphics.c4g -OutDir output

      - name: Publish System.c4g.c4u
        uses: actions/upload-artifact@v7
        with:
          name: System.c4g.c4u
          path: output/System.c4g.c4u

      - name: Publish Graphics.c4g.c4u
        uses: actions/upload-artifact@v7
        with:
          name: Graphics.c4g.c4u
          path: output/Graphics.c4g.c4u

  pack-zips:
    name: Pack ZIP Archives
    runs-on: ${{ matrix.runner }}
    needs: [generate-ci-config, build-content, build-system-graphics-updates]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-ci-config.outputs.matrix-release-publish) }}

    env:
      OBJVERSION: ${{ needs.generate-ci-config.outputs.objversion }}
      VERSION: ${{ needs.generate-ci-config.outputs.buildversion }}

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
           autobuild
           planet
      - uses: actions/download-artifact@v8
        with:
          name: clonk-${{ matrix.config-suffix }}
      - uses: actions/download-artifact@v8
        with:
          name: c4group-${{ matrix.config-suffix }}
      - uses: actions/download-artifact@v8
        with:
          pattern: '*.c4g'
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: content

      - name: Create output directory
        run: New-Item -Path output -ItemType Directory

      - name: Create Engine Archive
        run: |
          cd output
          New-Item -Path lc_${{ env.VERSION }}_${{ matrix.platform-suffix }} -ItemType Directory | Push-Location
          Copy-Item -Path ../../clonk* -Destination . -Recurse
          Copy-Item -Path ../../c4group* -Destination . -Recurse
          Copy-Item -Path ../../* -Include @('System.c4g', 'Graphics.c4g') -Destination .
          Copy-Item -Path ../../planet/gamecontrollerdb.txt -Destination .

      - name: Create Full Archive
        run: |
          cd output
          New-Item -Path lc_full_${{ env.VERSION }}_${{ matrix.platform-suffix }} -ItemType Directory | Push-Location
          Copy-Item -Path ../../clonk* -Destination . -Recurse
          Copy-Item -Path ../../c4group* -Destination . -Recurse
          Move-Item -Path ../../*.c4? -Destination .
          Copy-Item -Path ../../planet/gamecontrollerdb.txt -Destination .

      - name: "Linux: Pack Engine As Tarball"
        if: ${{ matrix.os == 'Linux' }}
        run: |
          cd output/lc_${{ env.VERSION }}_${{ matrix.platform-suffix }}
          chmod +x ./clonk ./c4group
          tar czf ../lc_${{ env.VERSION }}_${{ matrix.platform-suffix }}.tar.gz *
          Pop-Location

      - name: "Linux: Pack Full As Tarball"
        if: ${{ matrix.os == 'Linux' }}
        run: |
          cd output/lc_full_${{ env.VERSION }}_${{ matrix.platform-suffix }}
          chmod +x ./clonk ./c4group
          tar czf ../lc_full_${{ env.VERSION }}_${{ matrix.platform-suffix }}.tar.gz *

      - uses: actions/upload-artifact@v7
        if: ${{ matrix.os != 'Linux' }}
        with:
          name: lc_${{ env.VERSION }}_${{ matrix.platform-suffix }}.zip
          path: output/lc_${{ env.VERSION }}_${{ matrix.platform-suffix }}
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.os != 'Linux' }}
        with:
          name: lc_full_${{ env.VERSION }}_${{ matrix.platform-suffix }}.zip
          path: output/lc_full_${{ env.VERSION }}_${{ matrix.platform-suffix }}

      - uses: actions/upload-artifact@v7
        if: ${{ matrix.os == 'Linux' }}
        with:
          name: lc_${{ env.VERSION }}_${{ matrix.platform-suffix }}.tar.gz
          path: output/lc_${{ env.VERSION }}_${{ matrix.platform-suffix }}.tar.gz
      - uses: actions/upload-artifact@v7
        if: ${{ matrix.os == 'Linux' }}
        with:
          name: lc_full_${{ env.VERSION }}_${{ matrix.platform-suffix }}.tar.gz
          path: output/lc_full_${{ env.VERSION }}_${{ matrix.platform-suffix }}.tar.gz

  publish-portable:
    name: Publish Portable Archives
    runs-on: ${{ matrix.runner }}
    needs: [generate-ci-config, pack-zips, publish-github]
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.generate-ci-config.outputs.matrix-release-publish) }}
    env:
      VERSION: ${{ needs.generate-ci-config.outputs.buildversion }}
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            autobuild
            deps.lock
      - name: Download engine archive (zip)
        if: ${{ matrix.os != 'Linux' }}
        uses: actions/download-artifact@v8
        with:
          name: lc_${{ env.VERSION }}_${{ matrix.platform-suffix }}.zip
          path: portable-src
      - name: Download full archive (zip)
        if: ${{ matrix.os != 'Linux' }}
        uses: actions/download-artifact@v8
        with:
          name: lc_full_${{ env.VERSION }}_${{ matrix.platform-suffix }}.zip
          path: full-src
      - name: Download engine archive (tarball)
        if: ${{ matrix.os == 'Linux' }}
        uses: actions/download-artifact@v8
        with:
          name: lc_${{ env.VERSION }}_${{ matrix.platform-suffix }}.tar.gz
      - name: Download full archive (tarball)
        if: ${{ matrix.os == 'Linux' }}
        uses: actions/download-artifact@v8
        with:
          name: lc_full_${{ env.VERSION }}_${{ matrix.platform-suffix }}.tar.gz
      - name: "Linux: Extract staging tarballs"
        if: ${{ matrix.os == 'Linux' }}
        run: |
          mkdir portable-src full-src
          tar xzf lc_${{ env.VERSION }}_${{ matrix.platform-suffix }}.tar.gz -C portable-src
          tar xzf lc_full_${{ env.VERSION }}_${{ matrix.platform-suffix }}.tar.gz -C full-src
      - name: "Linux: Restore executable bit"
        if: ${{ matrix.os == 'Linux' }}
        run: |
          chmod +x portable-src/clonk portable-src/c4group
          chmod +x full-src/clonk full-src/c4group
      - name: "macOS: Restore executable bit"
        if: ${{ matrix.os == 'Mac' }}
        run: |
          chmod +x portable-src/clonk.app/Contents/MacOS/clonk portable-src/c4group
          chmod +x full-src/clonk.app/Contents/MacOS/clonk full-src/c4group
      - name: Build portable archive
        run: >
          autobuild/MakePortableArchive.ps1
          -Version ${{ env.VERSION }}
          -PlatformSuffix ${{ matrix.platform-suffix }}
          -Kind portable
          -SourceDir portable-src
          -OutDir out
          -Commit ${{ github.sha }}
          -Tag ${{ github.ref_name }}
      - name: Build full archive
        run: >
          autobuild/MakePortableArchive.ps1
          -Version ${{ env.VERSION }}
          -PlatformSuffix ${{ matrix.platform-suffix }}
          -Kind full
          -SourceDir full-src
          -OutDir out
          -Commit ${{ github.sha }}
          -Tag ${{ github.ref_name }}
      - name: Publish portable archives
        uses: ncipollo/release-action@v1.11.2
        with:
          artifacts: out/LegacyClonk-*.tar.gz
          allowUpdates: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
      - name: Upload per-platform checksum fragment
        uses: actions/upload-artifact@v7
        with:
          name: portable-${{ matrix.config-suffix }}
          path: out

  publish-portable-sums:
    name: Publish Portable Checksum Manifest
    runs-on: ubuntu-latest
    needs: [publish-portable]
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: 'portable-*'
      - name: Assemble SHA256SUMS
        shell: bash
        run: |
          cat portable-*/SHA256SUMS.part > SHA256SUMS
      - name: Verify fragment hashes
        shell: bash
        run: |
          for part in portable-*/SHA256SUMS.part; do
            (cd "$(dirname "$part")" && sha256sum -c SHA256SUMS.part)
          done
      - name: Verify manifest completeness
        shell: bash
        run: |
          LINES=$(wc -l < SHA256SUMS)
          if [ "$LINES" -ne 12 ]; then
            echo "SHA256SUMS has $LINES lines, expected 12 (6 publish legs x 2 kinds)" >&2
            exit 1
          fi
      - name: Publish SHA256SUMS
        uses: ncipollo/release-action@v1.11.2
        with:
          artifacts: SHA256SUMS
          allowUpdates: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true

  build-combined-update-groups:
    name: Build Combined Update Groups
    runs-on: ${{ matrix.runner }}
    needs: [generate-ci-config, build-content, build-system-graphics-updates]
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-ci-config.outputs.matrix-release-publish) }}
    env:
      C4GROUP: ${{ matrix.os == 'Windows' && './c4group.exe' || './c4group' }}
      MAJOR_UPDATE: ${{ needs.generate-ci-config.outputs.major-update }}
      OBJVERSION: ${{ needs.generate-ci-config.outputs.objversion }}
      OBJVERSIONNODOTS: ${{ needs.generate-ci-config.outputs.objversionnodots }}
      VERSION: ${{ needs.generate-ci-config.outputs.buildversion }}

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            autobuild
      - uses: actions/download-artifact@v8
        with:
          name: clonk-${{ matrix.config-suffix }}
      - uses: actions/download-artifact@v8
        with:
          name: c4group-${{ matrix.config-suffix }}
      - uses: actions/download-artifact@v8
        with:
          pattern: '*.c4g.c4u'
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: lc_${{ env.OBJVERSIONNODOTS }}.c4u
      - uses: actions/download-artifact@v8
        with:
          name: content-updates

      - name: Set Executable Bit
        if: ${{ matrix.os != 'Windows' }}
        run: |
          chmod +x ./clonk
          chmod +x ./c4group

      - name: Create output directory
        run: New-Item -Path output -ItemType Directory

      - name: Build Engine Update
        run: autobuild/MakeEngineUpdateGroups.ps1 -PlatformSuffix ${{ matrix.platform-suffix }} -RequireVersion ${{ env.OBJVERSION }} -OutDir output

      - name: Publish Engine Update
        uses: actions/upload-artifact@v7
        with:
          name: lc_${{ env.VERSION }}_${{ matrix.platform-suffix }}.c4u
          path: output/lc_${{ env.VERSION }}_${{ matrix.platform-suffix }}.c4u

      - name: Build Combined Update
        run: autobuild/MakeCombinedUpdateGroups.ps1 -PlatformSuffix ${{ matrix.platform-suffix }} -EngineUpdatePath output/lc_${{ env.VERSION }}_${{ matrix.platform-suffix }}.c4u -OutDir output

      - name: Publish Combined Minor Update
        if: ${{ !fromJson(env.MAJOR_UPDATE) }}
        uses: actions/upload-artifact@v7
        with:
          name: lc_${{ env.OBJVERSIONNODOTS }}_${{ env.VERSION }}_${{ matrix.platform-suffix }}.c4u
          path: output/lc_${{ env.OBJVERSIONNODOTS }}_${{ env.VERSION }}_${{ matrix.platform-suffix }}.c4u

      - name: Publish Combined Major Update
        if: ${{ fromJson(env.MAJOR_UPDATE) }}
        uses: actions/upload-artifact@v7
        with:
          name: lc_${{ env.OBJVERSIONNODOTS }}_${{ matrix.platform-suffix }}.c4u
          path: output/lc_${{ env.OBJVERSIONNODOTS }}_${{ matrix.platform-suffix }}.c4u

  build-setup:
    name: Build Setup
    runs-on: windows-latest
    needs: [generate-ci-config, build-content, build-system-graphics-updates]
    env:
      C4GROUP: ./c4group.exe
      MAJOR_UPDATE: ${{ needs.generate-ci-config.outputs.major-update }}
      OBJVERSION: ${{ needs.generate-ci-config.outputs.objversion }}
      OBJVERSIONNODOTS: ${{ needs.generate-ci-config.outputs.objversionnodots }}
      VERSION: ${{ needs.generate-ci-config.outputs.buildversion }}

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            licenses
            src/res

      - uses: actions/download-artifact@v8
        with:
          name: clonk-Windows-x64
      - uses: actions/download-artifact@v8
        with:
          name: c4group-Windows-x64

      - uses: actions/download-artifact@v8
        with:
          name: clonk-Windows-x86
          path: x86
      - uses: actions/download-artifact@v8
        with:
          name: c4group-Windows-x86
          path: x86

      - uses: actions/download-artifact@v8
        with:
          pattern: '*.c4g'
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: content

      - name: Move Licenses
        run:
          Move-Item -Path licenses/* -Include @('clonk_content_license.txt', 'clonk_trademark_license.txt') -Destination .

      - name: Build Installer
        uses: Minionguyjpro/Inno-Setup-Action@v1.2.2
        with:
          path: src/res/setup.iss
          options: >
            /DC4VERSION="${{ env.OBJVERSION }}"
            /DC4XVERBUILD=${{ env.VERSION }}
            /DC4SOURCEDIR=${{ github.workspace }}

      - name: Publish Installer
        uses: actions/upload-artifact@v7
        with:
          name: lc_setup_win.exe
          path: Output/lc_setup_win.exe

  publish-github:
    name: Publish To GitHub Release
    runs-on: ${{ matrix.runner }}
    needs:
      - generate-ci-config
      - changelog
      - build-binaries
      - build-content
      - build-system-graphics-updates
      - pack-zips
      - build-combined-update-groups
      - build-setup
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.generate-ci-config.outputs.matrix-release-publish) }}
    steps:
      - uses: actions/download-artifact@v8
        if: ${{ matrix.os != 'Linux' }}
        with:
          name: LegacyClonk-${{ matrix.config-suffix }}.zip
      - uses: actions/download-artifact@v8
        if: ${{ matrix.os == 'Linux' }}
        with:
          name: LegacyClonk-${{ matrix.config-suffix }}.tar.gz
      - uses: actions/download-artifact@v8
        if: ${{ matrix.publish-groups }}
        with:
          name: System.c4g
      - uses: actions/download-artifact@v8
        if: ${{ matrix.publish-groups }}
        with:
          name: Graphics.c4g
      - uses: actions/download-artifact@v8
        if: ${{ matrix.publish-groups }}
        with:
          name: content
          path: content
      - uses: actions/download-artifact@v8
        if: ${{ matrix.publish-groups }}
        with:
          name: lc_setup_win.exe

      - name: Download release notes
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          merge-multiple: true

      - name: Pack Content
        if: ${{ matrix.publish-groups }}
        run: |
          [System.IO.Compression.ZipFile]::CreateFromDirectory("content", "content.zip")

      - name: Publish Binaries
        if: ${{ matrix.os != 'Linux' }}
        uses: ncipollo/release-action@v1.11.2
        with:
          artifacts: LegacyClonk-${{ matrix.config-suffix }}.zip
          allowUpdates: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          bodyFile: release-notes.md
      - name: Publish Binaries
        if: ${{ matrix.os == 'Linux' }}
        uses: ncipollo/release-action@v1.11.2
        with:
          artifacts: LegacyClonk-${{ matrix.config-suffix }}.tar.gz
          allowUpdates: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          bodyFile: release-notes.md
      - name: Publish System.c4g
        if: ${{ matrix.publish-groups }}
        uses: ncipollo/release-action@v1.11.2
        with:
          artifacts: System.c4g
          allowUpdates: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          bodyFile: release-notes.md

      - name: Publish Graphics.c4g
        if: ${{ matrix.publish-groups }}
        uses: ncipollo/release-action@v1.11.2
        with:
          artifacts: Graphics.c4g
          allowUpdates: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          bodyFile: release-notes.md

      - name: Publish Content
        if: ${{ matrix.publish-groups }}
        uses: ncipollo/release-action@v1.11.2
        with:
          artifacts: content.zip
          allowUpdates: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          bodyFile: release-notes.md

      - name: Publish Installer
        if: ${{ matrix.publish-groups }}
        uses: ncipollo/release-action@v1.11.2
        with:
          artifacts: lc_setup_win.exe
          allowUpdates: true
          artifactErrorsFailBuild: true
          replacesArtifacts: true
          bodyFile: release-notes.md

  publish-itch:
    name: Publish To Itch.io
    runs-on: ${{ matrix.runner }}
    needs: [generate-ci-config, publish-github]
    if: github.repository_owner == 'legacyclonk'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.generate-ci-config.outputs.matrix-itch) }}
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
      BUTLER_DRY_RUN: ${{ needs.generate-ci-config.outputs.butler-dry-run }}
      MAJOR_UPDATE: ${{ needs.generate-ci-config.outputs.major-update }}
      OBJVERSION: ${{ needs.generate-ci-config.outputs.objversion }}
      OBJVERSIONNODOTS: ${{ needs.generate-ci-config.outputs.objversionnodots }}
      VERSION: ${{ needs.generate-ci-config.outputs.buildversion }}

    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: |
            autobuild
      - uses: actions/download-artifact@v8
        if: ${{ matrix.os != 'Linux' }}
        with:
          name: lc_full_${{ env.VERSION }}_${{ matrix.platform-suffix }}.zip
          path: lc_full
      - uses: actions/download-artifact@v8
        if: ${{ matrix.os == 'Linux' }}
        with:
          name: lc_full_${{ env.VERSION }}_${{ matrix.platform-suffix }}.tar.gz

      - name: "Linux: Uncompress Tarball"
        if: ${{ matrix.os == 'Linux' }}
        run: |
          mkdir lc_full
          cd lc_full
          tar xzf ../lc_full_${{ env.VERSION }}_${{ matrix.platform-suffix }}.tar.gz

      - name: Publish To Itch
        run: >
          autobuild/PublishToItch.ps1
          -OS ${{ matrix.os }}
          -Arch ${{ matrix.arch }}
          -PlatformSuffix ${{ matrix.platform-suffix }}
          -Manifest autobuild/itch/${{ matrix.itch-manifest }}.toml
          -Tag ${{ github.ref_name }}
