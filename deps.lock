[baseline.binaries]
# SHA-256 of the binaries produced by a clean from-scratch build with the
# above deps and tools, recorded via `tools/verify-repro.sh --update-baseline`.
# Only the raw clonk + c4group binaries are baselined — AppImage packaging
# is excluded (linuxdeploy introduces its own nondeterminism).
#
# NOTE: Baseline entries are absent in this commit because the engine build
# is currently broken (glibc conflict). Once the toolchain is fixed, a
# maintainer should run `tools/verify-repro.sh --update-baseline` on each
# platform to populate this section. Absent entries cause verify-repro.sh
# to print SKIP (not a failure) for that platform.
