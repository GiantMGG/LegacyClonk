name: Docs

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  docs-harvest-tests:
    name: Harvest unit + integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r docs/requirements.txt
      - run: pytest tools/test_harvest_callbacks.py -v

  docs-build:
    name: Build + deploy docs
    runs-on: ubuntu-latest
    needs: docs-harvest-tests
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # mike needs tags + history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r docs/requirements.txt
      - name: Harvest reference pages
        run: python tools/harvest_callbacks.py --src-dir src --out-dir docs/reference
      - name: Strict build (smoke test)
        run: mkdocs build --strict
      - name: Configure git for mike
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Deploy dev alias (main push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mike deploy --update-aliases dev
          mike set-alias dev dev
      - name: Deploy tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          mike deploy --update-aliases "$TAG" latest
          mike set-alias latest "$TAG"
