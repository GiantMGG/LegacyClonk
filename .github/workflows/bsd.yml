name: BSD

on:
  push:
    branches: '*'
    tags-ignore: '*'
  pull_request:
    branches: '*'
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  freebsd:
    name: FreeBSD 14.2 (console-only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: "FreeBSD VM: pkg install + build + test"
        uses: vmactions/freebsd-vm@f0552d3b69211736abd97f02ff3d4674c56b73b1 # v1.5.5
        with:
          mem: 4096
          cpus: 2
          usesh: bash
          cache-after-prepare: true
          prepare: |
            set -euo pipefail
            # FreeBSD ports install headers/libs under /usr/local; CMake does
            # not search there by default, so we pass -DCMAKE_PREFIX_PATH=/usr/local.
            pkg update -f
            pkg install -y \
              cmake \
              ninja \
              git \
              pkgconf \
              openssl \
              curl \
              zlib \
              fmtlib \
              libiconv \
              miniupnpc \
              spdlog \
              catch2
          run: |
            set -euo pipefail
            cd "$GITHUB_WORKSPACE"
            # Configure console-only, no LTO, tests on.
            # If find_package(miniupnpc CONFIG REQUIRED) fails because the
            # FreeBSD port ships only pkg-config files, fall back to
            # -DUSE_MINIUPNPC=OFF (UPnP is non-critical for a build smoke).
            if cmake -B build -G Ninja \
                  -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                  -DUSE_CONSOLE=ON \
                  -DUSE_TESTS=ON \
                  -DUSE_LTO=OFF \
                  -DCMAKE_PREFIX_PATH=/usr/local \
                  -DCMAKE_CTEST_ARGUMENTS='--output-on-failure;--no-tests=error'; then
              :
            else
              echo "Initial configure failed; retrying with -DUSE_MINIUPNPC=OFF"
              cmake -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=RelWithDebInfo \
                -DUSE_CONSOLE=ON \
                -DUSE_TESTS=ON \
                -DUSE_LTO=OFF \
                -DUSE_MINIUPNPC=OFF \
                -DCMAKE_PREFIX_PATH=/usr/local \
                -DCMAKE_CTEST_ARGUMENTS='--output-on-failure;--no-tests=error'
            fi
            cmake --build build
            ctest --test-dir build --output-on-failure --no-tests=error
