site_name: LegacyClonk Modder Docs
site_url: https://legacyclonk.github.io/LegacyClonk/
repo_url: https://github.com/legacyclonk/LegacyClonk
edit_uri: edit/main/docs/

# NOTE for contributors: run `python tools/harvest_callbacks.py` once before
# `mkdocs serve` so the auto-generated reference pages exist. The generated
# files are gitignored; CI runs the harvest before `mkdocs build`.

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
  palette:
    - scheme: default
      toggle: { icon: material/brightness-7, name: Light }
    - scheme: slate
      toggle: { icon: material/brightness-4, name: Dark }
  font:
    text: Roboto
    code: JetBrains Mono

plugins:
  - search
  - mike:
      version_selector: true
      alias_type: redirect
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Tutorials:
      - First object: tutorials/first-object.md
      - C4D pack anatomy: tutorials/c4d-anatomy.md
  - C4Script guide:
      - Overview: c4script/index.md
      - Syntax: c4script/syntax.md
      - Types: c4script/types.md
      - Control flow: c4script/control-flow.md
      - Proplists: c4script/proplists.md
      - Effects: c4script/effects.md
      - Actions: c4script/actions.md
      - Callback convention: c4script/callbacks-convention.md
  - Cookbook:
      - Overview: cookbook/index.md
      - Custom sword: cookbook/custom-sword.md
      - Flammable object: cookbook/flammable-object.md
      - Timer effect: cookbook/timer-effect.md
      - Scenario objective: cookbook/scenario-objective.md
      - Wire a menu: cookbook/wire-a-menu.md
      - Make a scenario: cookbook/make-a-scenario.md
  - Contributors:
      - Overview: contributors/index.md
      - Architecture: contributors/architecture.md
      - Contributing: contributors/contributing.md
      - C4Aul deep dive: contributors/c4aul.md
      - Network lockstep deep dive: contributors/network.md
      - Rendering pipeline deep dive: contributors/rendering.md
  - Players:
      - First game: players/first-game.md
  - Porting:
      - BSD port: BSD_PORT.md
  - Reference:
      - Object lifecycle callbacks: reference/callbacks/object-lifecycle.md
      - Combat callbacks: reference/callbacks/combat.md
      - Movement callbacks: reference/callbacks/movement.md
      - Player callbacks: reference/callbacks/player.md
      - Effect callbacks: reference/callbacks/effects.md
      - Action callbacks: reference/callbacks/actions.md
      - Menu callbacks: reference/callbacks/menu.md
      - Control callbacks: reference/callbacks/control.md
      - Misc callbacks: reference/callbacks/misc.md
      - Functions: reference/functions/index.md
      - Constants: reference/constants.md
      - DefCore.txt fields: reference/defcore.md

extra:
  version:
    provider: mike

extra_css:
  - stylesheets/extra.css
