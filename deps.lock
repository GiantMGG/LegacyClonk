# Pinned dependency tarballs, build-tool versions, and baseline binary hashes.
# Consumed by tools/verify-repro.sh and the CI Dependencies step
# (via tools/deps-lock.sh).
#
# To bump deps: see "For a maintainer bumping deps" in
# .opencode/specs/2026-08-26-0745-reproducible-build-pinning.md

