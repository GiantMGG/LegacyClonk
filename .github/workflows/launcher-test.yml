name: Launcher Tests

on:
  push:
  pull_request:

jobs:
  launcher-tests:
    name: Run lc launcher unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pytest
        run: pip install pytest

      - name: Run launcher tests
        run: python3 -m pytest tests/test_lc.py -v
